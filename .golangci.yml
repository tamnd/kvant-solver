version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose
    - errorlint
  settings:
    # misspell runs with no locale on purpose. Identifiers here follow the
    # standard library, which spells it image/color, and pdfimages names its own
    # column color too. Asking for UK spelling makes both of those lint errors
    # and finds nothing real in exchange.
    revive:
      rules:
        - name: exported
        - name: indent-error-flow
        - name: error-strings
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
